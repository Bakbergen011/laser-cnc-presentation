<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="driveBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="heatSink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" fill="#080c14" rx="8" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Banner -->
  <rect x="20" y="16" width="460" height="28" fill="rgba(0,240,255,0.08)" rx="4" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
  <text x="32" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00f0ff">AC SERVO DRIVE // EtherCAT 100Mbps (STO SIL3 / PLe INTEGRATED)</text>

  <!-- Left: Drive Unit 3D/Front View -->
  <!-- Heatsink Rear -->
  <rect x="50" y="65" width="22" height="185" fill="url(#heatSink)" rx="2" stroke="#475569" stroke-width="1"/>
  <line x1="57" y1="65" x2="57" y2="250" stroke="#0f172a" stroke-width="2"/>
  <line x1="64" y1="65" x2="64" y2="250" stroke="#0f172a" stroke-width="2"/>

  <!-- Drive Main Front Enclosure -->
  <rect x="72" y="60" width="120" height="195" rx="6" fill="url(#driveBody)" stroke="#334155" stroke-width="2"/>

  <!-- Top Display: 7-Segment LED (CSP 00) -->
  <rect x="86" y="74" width="92" height="34" fill="#020617" rx="4" stroke="#ff6b00" stroke-width="1.2"/>
  <text x="96" y="96" font-family="'Orbitron', monospace" font-size="16" fill="#ff6b00" font-weight="bold">rUn</text>
  <text x="145" y="96" font-family="'Orbitron', monospace" font-size="16" fill="#00ff88" font-weight="bold">OP</text>

  <!-- EtherCAT RJ45 Ports (IN / OUT) -->
  <rect x="86" y="118" width="42" height="26" fill="#0f172a" rx="3" stroke="#00f0ff" stroke-width="1"/>
  <text x="92" y="134" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#00f0ff" font-weight="bold">ECAT IN</text>

  <rect x="136" y="118" width="42" height="26" fill="#0f172a" rx="3" stroke="#00f0ff" stroke-width="1"/>
  <text x="140" y="134" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#00f0ff" font-weight="bold">ECAT OUT</text>

  <!-- Encoder Feedback Connector (CN2) -->
  <rect x="86" y="152" width="92" height="24" fill="#065f46" rx="3" stroke="#10b981" stroke-width="1"/>
  <text x="96" y="167" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" font-weight="bold">CN2: 23-bit ENCODER</text>

  <!-- STO & I/O Terminal Block -->
  <rect x="86" y="184" width="92" height="24" fill="#7f1d1d" rx="3" stroke="#ef4444" stroke-width="1"/>
  <text x="96" y="199" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" font-weight="bold">STO: DUAL NC 24V</text>

  <!-- 380V Power Screw Terminals (L1, L2, L3, U, V, W, PE) -->
  <rect x="86" y="216" width="92" height="28" fill="#1e293b" rx="3" stroke="#475569" stroke-width="1"/>
  <g fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="7">
    <circle cx="95" cy="230" r="3.5" fill="#e2e8f0"/>
    <circle cx="107" cy="230" r="3.5" fill="#e2e8f0"/>
    <circle cx="119" cy="230" r="3.5" fill="#e2e8f0"/>
    <circle cx="137" cy="230" r="3.5" fill="#ff6b00"/>
    <circle cx="149" cy="230" r="3.5" fill="#ff6b00"/>
    <circle cx="161" cy="230" r="3.5" fill="#ff6b00"/>
    <circle cx="173" cy="230" r="3.5" fill="#10b981"/>
  </g>

  <!-- Right: Control Loop Architecture Flow Chart -->
  <g transform="translate(220, 60)">
    <!-- Node 1: CNC / PLC -->
    <rect x="0" y="0" width="115" height="34" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="12" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" font-weight="bold">CNC / PLC</text>

    <!-- Arrow down -->
    <path d="M 57 34 L 57 52" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
    <polygon points="57,56 53,49 61,49" fill="#00f0ff"/>
    <text x="64" y="47" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">EtherCAT 1ms</text>

    <!-- Node 2: Servo Drive -->
    <rect x="0" y="56" width="115" height="34" rx="4" fill="#0f172a" stroke="#ff6b00" stroke-width="1.2"/>
    <text x="10" y="77" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff6b00" font-weight="bold">SERVO DRIVE</text>

    <!-- Arrow down -->
    <path d="M 57 90 L 57 108" stroke="#ff6b00" stroke-width="1.5" fill="none"/>
    <polygon points="57,112 53,105 61,105" fill="#ff6b00"/>
    <text x="64" y="103" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">PWM 380V</text>

    <!-- Node 3: Servo Motor -->
    <rect x="0" y="112" width="115" height="34" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="10" y="133" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f59e0b" font-weight="bold">SERVO MOTOR</text>

    <!-- Arrow down -->
    <path d="M 57 146 L 57 164" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <polygon points="57,168 53,161 61,161" fill="#f59e0b"/>
    <text x="64" y="159" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Torque</text>

    <!-- Node 4: Mechanical Axis -->
    <rect x="0" y="168" width="115" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
    <text x="8" y="187" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1" font-weight="bold">X/Y/Z РЕЙКА-ШВП</text>

    <!-- Feedback loop reverse line -->
    <path d="M 115 129 L 205 129 L 205 17 L 115 17" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <polygon points="115,17 122,13 122,21" fill="#10b981"/>
    <text x="130" y="70" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981" font-weight="bold" transform="rotate(90 130 70)">ENCODER FEEDBACK</text>
  </g>
</svg>
