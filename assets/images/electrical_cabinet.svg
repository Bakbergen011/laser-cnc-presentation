<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cabEnclosure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dinRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="300" fill="#080c14" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Title Banner -->
  <rect x="15" y="10" width="490" height="24" fill="rgba(255,107,0,0.08)" rx="4" stroke="rgba(255,107,0,0.25)" stroke-width="1"/>
  <text x="25" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#ff9100">INDUSTRIAL ELECTRICAL CONTROL CABINET // 380V POWER & 24V AUTOMATION</text>

  <!-- Cabinet Steel Outer Frame -->
  <rect x="25" y="42" width="470" height="246" rx="6" fill="url(#cabEnclosure)" stroke="#475569" stroke-width="2"/>
  
  <!-- DIN Rails (3 horizontal rows) -->
  <rect x="40" y="75" width="440" height="10" fill="url(#dinRail)" rx="1"/>
  <rect x="40" y="145" width="440" height="10" fill="url(#dinRail)" rx="1"/>
  <rect x="40" y="215" width="440" height="10" fill="url(#dinRail)" rx="1"/>

  <!-- Wiring Ducts (Grey Slotted Trunking) -->
  <rect x="35" y="55" width="450" height="12" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="125" width="450" height="12" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="195" width="450" height="12" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="265" width="450" height="12" fill="#334155" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1: 380V Power Distribution, Line Filter, 24V PSU & Safety Relay -->
  <g transform="translate(50, 70)">
    <!-- Main 380V 3P Breaker -->
    <rect x="0" y="0" width="45" height="50" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <text x="5" y="14" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ef4444" font-weight="bold">QF1: 380V</text>
    <rect x="8" y="20" width="29" height="16" fill="#ef4444" rx="2"/>
    <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" font-weight="bold">MAIN</text>

    <!-- EMC Line Filter -->
    <rect x="52" y="0" width="55" height="50" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
    <text x="56" y="14" font-family="'JetBrains Mono', monospace" font-size="7" fill="#cbd5e1" font-weight="bold">EMC FILTER</text>
    <text x="56" y="28" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#64748b">3x400V 50A</text>

    <!-- 24V DC Switching Power Supply -->
    <rect x="115" y="-5" width="65" height="55" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="120" y="10" font-family="'JetBrains Mono', monospace" font-size="7" fill="#f59e0b" font-weight="bold">PSU 24V 20A</text>
    <circle cx="125" cy="22" r="3" fill="#10b981"/><text x="132" y="25" font-size="6.5" fill="#e2e8f0">DC OK</text>
    <text x="120" y="42" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#64748b">Control Power</text>

    <!-- Safety Relay (Pilz PNOZ style dual channel) -->
    <rect x="188" y="0" width="55" height="50" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
    <text x="192" y="12" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff" font-weight="bold">SAFETY RELAY</text>
    <circle cx="198" cy="24" r="2.5" fill="#10b981"/><circle cx="208" cy="24" r="2.5" fill="#10b981"/>
    <text x="215" y="26" font-size="6" fill="#e2e8f0">CH1/CH2</text>
    <text x="194" y="42" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#fca5a5">STO Master</text>

    <!-- PLC CPU & Modular I/O Rack -->
    <rect x="250" y="-5" width="165" height="55" rx="3" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="256" y="10" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00f0ff" font-weight="bold">PLC ETHERCAT MASTER + REMOTE I/O</text>
    <rect x="256" y="18" width="35" height="28" fill="#1e293b" rx="2"/><text x="260" y="34" font-size="7" fill="#00f0ff">CPU</text>
    <rect x="295" y="18" width="26" height="28" fill="#1e293b" rx="2"/><text x="299" y="34" font-size="7" fill="#10b981">16DI</text>
    <rect x="325" y="18" width="26" height="28" fill="#1e293b" rx="2"/><text x="329" y="34" font-size="7" fill="#ff6b00">16DO</text>
    <rect x="355" y="18" width="26" height="28" fill="#1e293b" rx="2"/><text x="359" y="34" font-size="7" fill="#a855f7">4AI</text>
    <rect x="385" y="18" width="26" height="28" fill="#1e293b" rx="2"/><text x="389" y="34" font-size="7" fill="#00f0ff">2AO</text>
  </g>

  <!-- Row 2: 4x AC Servo Drives (X, Y1, Y2, Z) with EtherCAT Daisy Chain -->
  <g transform="translate(50, 140)">
    <!-- X Servo Drive -->
    <rect x="10" y="0" width="85" height="50" rx="3" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="16" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#00f0ff" font-weight="bold">DRIVE 1: X-AXIS</text>
    <rect x="16" y="20" width="30" height="12" fill="#020617"/><text x="20" y="29" font-size="7" fill="#ff6b00">rUn</text>
    <text x="16" y="44" font-size="6.5" fill="#94a3b8">1.5kW 3000rpm</text>

    <!-- Y1 Servo Drive -->
    <rect x="105" y="0" width="85" height="50" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="111" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#10b981" font-weight="bold">DRIVE 2: Y1-AXIS</text>
    <rect x="111" y="20" width="30" height="12" fill="#020617"/><text x="115" y="29" font-size="7" fill="#ff6b00">rUn</text>
    <text x="111" y="44" font-size="6.5" fill="#94a3b8">2.0kW Master</text>

    <!-- Y2 Servo Drive -->
    <rect x="200" y="0" width="85" height="50" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="206" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#10b981" font-weight="bold">DRIVE 3: Y2-AXIS</text>
    <rect x="206" y="20" width="30" height="12" fill="#020617"/><text x="210" y="29" font-size="7" fill="#ff6b00">rUn</text>
    <text x="206" y="44" font-size="6.5" fill="#94a3b8">2.0kW Sync Slave</text>

    <!-- Z Servo Drive -->
    <rect x="295" y="0" width="85" height="50" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="301" y="14" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#f59e0b" font-weight="bold">DRIVE 4: Z-AXIS</text>
    <rect x="301" y="20" width="30" height="12" fill="#020617"/><text x="305" y="29" font-size="7" fill="#ff6b00">rUn</text>
    <text x="301" y="44" font-size="6.5" fill="#94a3b8">0.75kW + Brake</text>

    <!-- Laser Interface Controller Box -->
    <rect x="390" y="0" width="35" height="50" rx="3" fill="#1e293b" stroke="#ff6b00" stroke-width="1"/>
    <text x="393" y="14" font-size="6" fill="#ff6b00" font-weight="bold">LASER</text>
    <text x="393" y="24" font-size="6" fill="#ff6b00" font-weight="bold">CTRL</text>
    <circle cx="407" cy="38" r="3" fill="#10b981"/>
  </g>

  <!-- Row 3: Industrial Terminal Blocks (Weidmüller / Phoenix Contact style) -->
  <g transform="translate(50, 210)">
    <rect x="10" y="0" width="415" height="50" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="14" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" font-weight="bold">FIELD I/O & POWER TERMINAL STRIP (XT1, XT2, XT3)</text>
    <!-- Color Coded Terminal Slices -->
    <g transform="translate(20, 20)">
      <!-- 24V & GND (Blue/Red) -->
      <rect x="0" y="0" width="45" height="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.5"/><text x="4" y="15" font-size="6.5" fill="#ffffff">24V / 0V</text>
      <!-- DI Sensors (Cyan) -->
      <rect x="50" y="0" width="75" height="24" fill="#083344" stroke="#00f0ff" stroke-width="0.5"/><text x="54" y="15" font-size="6.5" fill="#ffffff">DI: Endstops, Gas</text>
      <!-- DO Valves & Shutter (Orange) -->
      <rect x="130" y="0" width="75" height="24" fill="#431407" stroke="#ff6b00" stroke-width="0.5"/><text x="134" y="15" font-size="6.5" fill="#ffffff">DO: Solenoid, Shutter</text>
      <!-- AI Analog (Purple) -->
      <rect x="210" y="0" width="75" height="24" fill="#3b0764" stroke="#a855f7" stroke-width="0.5"/><text x="214" y="15" font-size="6.5" fill="#ffffff">AI: Height, PT100</text>
      <!-- Motor Power (Yellow/PE) -->
      <rect x="290" y="0" width="100" height="24" fill="#713f12" stroke="#eab308" stroke-width="0.5"/><text x="294" y="15" font-size="6.5" fill="#ffffff">380V U/V/W + PE Earth</text>
    </g>
  </g>
</svg>
