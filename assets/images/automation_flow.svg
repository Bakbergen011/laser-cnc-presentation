<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="320" fill="#080c14" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- Header -->
  <rect x="15" y="10" width="510" height="24" fill="rgba(0,240,255,0.08)" rx="4" stroke="rgba(0,240,255,0.25)" stroke-width="1"/>
  <text x="25" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00f0ff">END-TO-END AUTOMATION CONTROL ARCHITECTURE (CLOSED-LOOP CYCLE)</text>

  <!-- Top Flow: Forward Control Path (Left to Right) -->
  <!-- 1. Sensor Input -->
  <g transform="translate(25, 48)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00f0ff" font-weight="bold">1. SENSORS</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">Capacitive, Limits</text>
  </g>

  <!-- Arrow -->
  <path d="M 130 69 L 150 69" stroke="#00f0ff" stroke-width="1.5"/>
  <polygon points="150,69 144,65 144,73" fill="#00f0ff"/>

  <!-- 2. PLC / CNC Controller -->
  <g transform="translate(150, 48)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10b981" font-weight="bold">2. PLC / CNC</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">G-Code, PID, Interp</text>
  </g>

  <!-- Arrow -->
  <path d="M 255 69 L 275 69" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="275,69 269,65 269,73" fill="#10b981"/>

  <!-- 3. Control Signal -->
  <g transform="translate(275, 48)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#ff6b00" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ff6b00" font-weight="bold">3. CONTROL BUS</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">EtherCAT 1ms Sync</text>
  </g>

  <!-- Arrow -->
  <path d="M 380 69 L 400 69" stroke="#ff6b00" stroke-width="1.5"/>
  <polygon points="400,69 394,65 394,73" fill="#ff6b00"/>

  <!-- 4. Servo Drive -->
  <g transform="translate(400, 48)">
    <rect width="115" height="42" rx="4" fill="url(#flowGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" font-weight="bold">4. SERVO DRIVE</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">IGBT 380V Inverter</text>
  </g>

  <!-- Turn Arrow Down -->
  <path d="M 457 90 L 457 115" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="457,115 453,109 461,109" fill="#f59e0b"/>

  <!-- Middle Row: Power Actuators (Right to Left) -->
  <!-- 5. Servo Motor -->
  <g transform="translate(400, 115)">
    <rect width="115" height="42" rx="4" fill="url(#flowGrad)" stroke="#eab308" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#eab308" font-weight="bold">5. SERVO MOTOR</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">3000 RPM Torque</text>
  </g>

  <!-- Arrow Left -->
  <path d="M 400 136 L 380 136" stroke="#eab308" stroke-width="1.5"/>
  <polygon points="380,136 386,132 386,140" fill="#eab308"/>

  <!-- 6. X/Y/Z Mechanical Axes -->
  <g transform="translate(275, 115)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#a855f7" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a855f7" font-weight="bold">6. X/Y/Z AXES</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">Rack &amp; Ball Screw</text>
  </g>

  <!-- Arrow Left -->
  <path d="M 275 136 L 255 136" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="255,136 261,132 261,140" fill="#a855f7"/>

  <!-- 7. Laser Cutting Head -->
  <g transform="translate(150, 115)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#ec4899" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ec4899" font-weight="bold">7. LASER HEAD</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">Autofocus Optics</text>
  </g>

  <!-- Arrow Left -->
  <path d="M 150 136 L 130 136" stroke="#ec4899" stroke-width="1.5"/>
  <polygon points="130,136 136,132 136,140" fill="#ec4899"/>

  <!-- 8. Cutting Process -->
  <g transform="translate(25, 115)">
    <rect width="105" height="42" rx="4" fill="url(#flowGrad)" stroke="#ef4444" stroke-width="1.2"/>
    <text x="8" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ef4444" font-weight="bold">8. CUTTING</text>
    <text x="8" y="32" font-size="7.5" fill="#94a3b8">1070nm + Gas Jet</text>
  </g>

  <!-- Turn Arrow Down to Feedback Loop -->
  <path d="M 77 157 L 77 185" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="77,185 73,179 81,179" fill="#ef4444"/>

  <!-- Bottom Row: Closed-Loop Feedback Path -->
  <!-- 9. Encoder & Sensor Feedback -->
  <g transform="translate(25, 185)">
    <rect width="230" height="45" rx="4" fill="url(#flowGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" font-weight="bold">9. ENCODER &amp; HEIGHT FEEDBACK</text>
    <text x="12" y="34" font-size="8" fill="#94a3b8">23-bit Optical Counts (BiSS-C) + Capacitive 0-10V</text>
  </g>

  <!-- Feedback Return Line back to PLC/CNC (Node 2) -->
  <path d="M 255 207 L 340 207 L 340 245 L 202 245 L 202 90" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4,3" fill="none"/>
  <polygon points="202,90 198,97 206,97" fill="#10b981"/>
  <text x="215" y="238" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981" font-weight="bold">REAL-TIME CLOSED-LOOP CORRECTION (Δ = Setpoint - Feedback → 0.00 mm)</text>

  <!-- Bottom Spec Note -->
  <text x="30" y="280" font-family="'Inter', sans-serif" font-size="10.5" fill="#cbd5e1">✓ Барлық атқарушы механизмдер жабық кері байланыс контурымен басқарылады.</text>
  <text x="30" y="296" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Орын қателігі мен биіктік ауытқуы 1 мс ішінде автоматты түрде реттеледі.</text>
</svg>
