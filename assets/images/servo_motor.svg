<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="servoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metalShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="flangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="connectorOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#cc5200"/>
    </linearGradient>
  </defs>

  <!-- Background grid subtle -->
  <rect width="500" height="280" fill="#080c14" rx="8" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Industrial Spec Banner -->
  <rect x="20" y="16" width="460" height="28" fill="rgba(255,107,0,0.1)" rx="4" stroke="rgba(255,107,0,0.3)" stroke-width="1"/>
  <text x="32" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ff9100">AC SERVO MOTOR // 1.5 kW - 3000 RPM (23-BIT ABSOLUTE OPTICAL ENCODER)</text>

  <!-- Mounting Flange -->
  <rect x="70" y="80" width="24" height="130" rx="4" fill="url(#flangeGrad)" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="82" cy="95" r="4.5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="82" cy="195" r="4.5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Output Shaft & Keyway -->
  <rect x="30" y="132" width="40" height="26" fill="url(#metalShaft)" stroke="#475569" stroke-width="1"/>
  <rect x="36" y="138" width="18" height="5" fill="#334155"/>
  <path d="M 30 132 L 20 145 L 30 158 Z" fill="#94a3b8"/>

  <!-- Motor Main Housing with Cooling Ribs -->
  <rect x="94" y="85" width="220" height="120" rx="6" fill="url(#servoBody)" stroke="#334155" stroke-width="2"/>
  <!-- Cooling fins -->
  <g stroke="#334155" stroke-width="2">
    <line x1="115" y1="85" x2="115" y2="205"/>
    <line x1="135" y1="85" x2="135" y2="205"/>
    <line x1="155" y1="85" x2="155" y2="205"/>
    <line x1="175" y1="85" x2="175" y2="205"/>
    <line x1="195" y1="85" x2="195" y2="205"/>
    <line x1="215" y1="85" x2="215" y2="205"/>
    <line x1="235" y1="85" x2="235" y2="205"/>
    <line x1="255" y1="85" x2="255" y2="205"/>
    <line x1="275" y1="85" x2="275" y2="205"/>
    <line x1="295" y1="85" x2="295" y2="205"/>
  </g>

  <!-- Nameplate badge -->
  <rect x="140" y="125" width="130" height="40" fill="#020617" rx="3" stroke="#475569" stroke-width="1"/>
  <text x="148" y="140" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" font-weight="bold">INDUSTRIAL SERVO</text>
  <text x="148" y="152" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">3AC 380V | 4.8A | IP67</text>
  <text x="148" y="161" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#64748b">TORQUE: 4.77 N·m</text>

  <!-- Dual Military Connectors (Power + Encoder) -->
  <!-- Power Plug (Orange) -->
  <rect x="120" y="58" width="34" height="27" rx="3" fill="url(#connectorOrange)" stroke="#ffaa00" stroke-width="1.5"/>
  <rect x="126" y="50" width="22" height="8" rx="2" fill="#334155"/>
  <text x="123" y="75" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff" font-weight="bold">PWR 380V</text>

  <!-- Encoder Plug (Green / BiSS-C) -->
  <rect x="230" y="58" width="34" height="27" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <rect x="236" y="50" width="22" height="8" rx="2" fill="#334155"/>
  <text x="234" y="75" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff" font-weight="bold">ENC 23b</text>

  <!-- Rear Cap (Optical Encoder Chamber) -->
  <rect x="314" y="92" width="45" height="106" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="336" cy="145" r="14" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="323" y="148" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00f0ff">OPTIC</text>

  <!-- Technical Callouts & Specs -->
  <g font-family="'Inter', sans-serif" font-size="11">
    <!-- Callout 1: Shaft -->
    <path d="M 50 162 L 50 240 L 90 240" stroke="#00f0ff" stroke-width="1" fill="none"/>
    <circle cx="50" cy="162" r="3" fill="#00f0ff"/>
    <text x="96" y="244" fill="#94a3b8">Косозубая шестерня / ШВП қосылысы</text>

    <!-- Callout 2: 23-bit encoder -->
    <path d="M 340 198 L 340 240 L 375 240" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="340" cy="198" r="3" fill="#10b981"/>
    <text x="382" y="244" fill="#10b981" font-weight="bold">23-bit Абсолютті кері байланыс</text>
  </g>
</svg>
