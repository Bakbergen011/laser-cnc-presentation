<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="plcRack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="280" fill="#080c14" rx="8" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Banner -->
  <rect x="20" y="14" width="460" height="28" fill="rgba(16,185,129,0.08)" rx="4" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="32" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#10b981">PLC CONTROLLER // MODULAR INDUSTRIAL AUTOMATION (REAL-TIME EtherCAT)</text>

  <!-- DIN Rail Background -->
  <rect x="30" y="110" width="440" height="26" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <line x1="30" y1="123" x2="470" y2="123" stroke="#94a3b8" stroke-width="2"/>

  <!-- Module 1: 24V DC Power Supply -->
  <g transform="translate(45, 60)">
    <rect width="65" height="150" rx="4" fill="url(#moduleGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="6" y="8" width="53" height="20" rx="2" fill="#020617"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f59e0b" font-weight="bold">PS 24V</text>
    <circle cx="15" cy="40" r="3.5" fill="#10b981"/>
    <text x="24" y="43" font-family="'JetBrains Mono', monospace" font-size="7" fill="#cbd5e1">DC OK</text>
    <!-- Terminals -->
    <rect x="8" y="105" width="49" height="36" fill="#020617" rx="2"/>
    <circle cx="18" cy="115" r="3" fill="#ef4444"/><text x="24" y="118" font-size="7" fill="#94a3b8">L</text>
    <circle cx="18" cy="125" r="3" fill="#0099ff"/><text x="24" y="128" font-size="7" fill="#94a3b8">N</text>
    <circle cx="18" cy="135" r="3" fill="#10b981"/><text x="24" y="138" font-size="7" fill="#94a3b8">PE</text>
  </g>

  <!-- Module 2: CPU / CNC Controller Module -->
  <g transform="translate(115, 55)">
    <rect width="105" height="160" rx="5" fill="url(#plcRack)" stroke="#00f0ff" stroke-width="1.8"/>
    <rect x="8" y="8" width="89" height="38" rx="3" fill="#020617" stroke="#00f0ff" stroke-width="1"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" font-weight="bold">CNC CPU</text>
    <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">REAL-TIME OS</text>
    <!-- LEDs -->
    <circle cx="20" cy="58" r="3.5" fill="#10b981"/><text x="28" y="61" font-size="7.5" fill="#e2e8f0">RUN</text>
    <circle cx="60" cy="58" r="3.5" fill="#334155"/><text x="68" y="61" font-size="7.5" fill="#64748b">ERR</text>
    <circle cx="20" cy="72" r="3.5" fill="#10b981"/><text x="28" y="75" font-size="7.5" fill="#e2e8f0">LINK</text>
    <circle cx="60" cy="72" r="3.5" fill="#ff6b00"/><text x="68" y="75" font-size="7.5" fill="#e2e8f0">SYNC</text>
    <!-- Dual RJ45 EtherCAT Master Ports -->
    <rect x="12" y="90" width="38" height="26" rx="2" fill="#020617" stroke="#00f0ff" stroke-width="1"/>
    <text x="16" y="106" font-size="7" fill="#00f0ff" font-weight="bold">ETH 1</text>
    <rect x="55" y="90" width="38" height="26" rx="2" fill="#020617" stroke="#00f0ff" stroke-width="1"/>
    <text x="59" y="106" font-size="7" fill="#00f0ff" font-weight="bold">ECAT M</text>
    <!-- USB / Debug Port -->
    <rect x="25" y="125" width="55" height="18" rx="2" fill="#1e293b"/>
    <text x="35" y="138" font-size="7" fill="#94a3b8">USB / DBG</text>
  </g>

  <!-- Module 3: 16x Digital Input (DI 24V) -->
  <g transform="translate(225, 60)">
    <rect width="70" height="150" rx="4" fill="url(#moduleGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00f0ff" font-weight="bold">DI 16x 24V</text>
    <!-- Status LED Grid (16 bits) -->
    <g transform="translate(8, 28)">
      <circle cx="8" cy="8" r="2.5" fill="#10b981"/><circle cx="22" cy="8" r="2.5" fill="#10b981"/>
      <circle cx="36" cy="8" r="2.5" fill="#10b981"/><circle cx="50" cy="8" r="2.5" fill="#10b981"/>
      <circle cx="8" cy="20" r="2.5" fill="#334155"/><circle cx="22" cy="20" r="2.5" fill="#334155"/>
      <circle cx="36" cy="20" r="2.5" fill="#334155"/><circle cx="50" cy="20" r="2.5" fill="#334155"/>
    </g>
    <!-- Screw Terminals -->
    <rect x="8" y="70" width="54" height="72" fill="#020617" rx="2"/>
    <text x="14" y="85" font-size="7" fill="#64748b">E-Stop, Door,</text>
    <text x="14" y="97" font-size="7" fill="#64748b">Limit Switches</text>
    <text x="14" y="109" font-size="7" fill="#64748b">Pressure SW</text>
  </g>

  <!-- Module 4: 16x Digital Output (DO 24V) -->
  <g transform="translate(300, 60)">
    <rect width="70" height="150" rx="4" fill="url(#moduleGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#ff6b00" font-weight="bold">DO 16x 24V</text>
    <!-- Status LED Grid -->
    <g transform="translate(8, 28)">
      <circle cx="8" cy="8" r="2.5" fill="#ff6b00"/><circle cx="22" cy="8" r="2.5" fill="#ff6b00"/>
      <circle cx="36" cy="8" r="2.5" fill="#ff6b00"/><circle cx="50" cy="8" r="2.5" fill="#334155"/>
      <circle cx="8" cy="20" r="2.5" fill="#334155"/><circle cx="22" cy="20" r="2.5" fill="#334155"/>
      <circle cx="36" cy="20" r="2.5" fill="#334155"/><circle cx="50" cy="20" r="2.5" fill="#334155"/>
    </g>
    <rect x="8" y="70" width="54" height="72" fill="#020617" rx="2"/>
    <text x="14" y="85" font-size="7" fill="#64748b">Laser Shutter,</text>
    <text x="14" y="97" font-size="7" fill="#64748b">Gas Solenoids,</text>
    <text x="14" y="109" font-size="7" fill="#64748b">Status Tower</text>
  </g>

  <!-- Module 5: Analog I/O (AI 4ch / AO 2ch) -->
  <g transform="translate(375, 60)">
    <rect width="80" height="150" rx="4" fill="url(#moduleGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a855f7" font-weight="bold">AI/AO 0-10V</text>
    <circle cx="18" cy="38" r="3" fill="#a855f7"/><text x="26" y="41" font-size="7" fill="#e2e8f0">AI0 (Height)</text>
    <circle cx="18" cy="50" r="3" fill="#a855f7"/><text x="26" y="53" font-size="7" fill="#e2e8f0">AI1 (Temp)</text>
    <circle cx="18" cy="62" r="3" fill="#a855f7"/><text x="26" y="65" font-size="7" fill="#e2e8f0">AO0 (Pwr DAC)</text>
    <rect x="8" y="75" width="64" height="67" fill="#020617" rx="2"/>
    <text x="12" y="92" font-size="7" fill="#94a3b8">4-20mA / 0-10V</text>
    <text x="12" y="104" font-size="7" fill="#94a3b8">16-bit ADC High-Res</text>
  </g>

  <!-- Bottom Explanatory Caption -->
  <text x="35" y="242" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">«Өнеркәсіптік PLC — демонстрациялық архитектура»</text>
  <text x="35" y="258" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Датчиктерден сигнал қабылдайды, атқарушы механизмдерді және технологиялық процесті басқарады.</text>
</svg>
